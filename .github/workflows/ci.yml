name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix desktop

      - name: Validate IPC contract governance
        run: node scripts/check-ipc-contract-governance.mjs

      - name: Check AI eval report policy
        run: npm run ci:ai-report

      - name: Lint
        run: npm run lint

      - name: Validate frontend and desktop package
        run: |
          npm run build
          npm run compile --prefix desktop
          npm run build:dir --prefix desktop

      - name: Test
        run: npm run test:ci
